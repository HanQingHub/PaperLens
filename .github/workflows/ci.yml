name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    name: server pytest
    runs-on: [self-hosted, windows, x64, paperlens]
    steps:
      - uses: actions/checkout@v4
      - name: Run server pytest
        shell: pwsh
        run: |
          $py = "D:\paperlens-ci\server\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "server venv 缺失：$py（见 docs/CI自托管runner安装说明.md）" }
          Push-Location apps\server
          & $py -m pytest -q
          Pop-Location

  ocr-worker-tests:
    name: ocr-worker pytest
    runs-on: [self-hosted, windows, x64, paperlens]
    steps:
      - uses: actions/checkout@v4
      - name: Run ocr-worker pytest
        shell: pwsh
        run: |
          $py = "D:\paperlens-ci\ocr-worker\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "ocr-worker venv 缺失：$py（见 docs/CI自托管runner安装说明.md）" }
          Push-Location apps\ocr-worker
          & $py -m pytest -q
          Pop-Location

  frontend-build:
    name: frontend npm build
    runs-on: [self-hosted, windows, x64, paperlens]
    steps:
      - uses: actions/checkout@v4
      - name: npm ci
        shell: pwsh
        run: npm ci
        working-directory: apps/desktop
        # 注：若 runner 上 node_modules 已持久化（仅依赖变更后需重建），可注释掉本步
      - name: npm run build
        shell: pwsh
        run: npm run build
        working-directory: apps/desktop

  lint:
    name: ruff + eslint
    runs-on: [self-hosted, windows, x64, paperlens]
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        shell: pwsh
        run: |
          $pyS = "D:\paperlens-ci\server\.venv\Scripts\python.exe"
          $pyW = "D:\paperlens-ci\ocr-worker\.venv\Scripts\python.exe"
          if (Test-Path $pyS) { & $pyS -m pip install -q ruff==0.6.9; & $pyS -m ruff check apps/server 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -ne 0) { throw "ruff failed" } } else { Write-Host "server venv 缺失，跳过 ruff" -ForegroundColor Yellow }
          if (Test-Path $pyW) { & $pyW -m pip install -q ruff==0.6.9; & $pyW -m ruff check apps/ocr-worker 2>&1 | Out-String | Write-Host; if ($LASTEXITCODE -ne 0) { throw "ruff failed" } } else { Write-Host "ocr-worker venv 缺失，跳过 ruff" -ForegroundColor Yellow }
      - name: eslint
        shell: pwsh
        run: npm run lint
        working-directory: apps/desktop