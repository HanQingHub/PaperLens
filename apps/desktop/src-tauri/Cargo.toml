[package]
name = "paperlens-desktop"
version = "0.7.3"
description = "PaperLens desktop shell (Tauri v2 thin shell)"
authors = ["筝青寒"]
edition = "2021"

[lib]
# The name and crate type of the generated library. rlib is enough for the
# desktop binary; keep it minimal (no cdylib/staticlib since we have no mobile target).
name = "paperlens_desktop_lib"
crate-type = ["rlib"]

# See more keys at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Tests set directory mtimes on Windows (std::fs cannot open directories;
# set_file_mtime uses FILE_FLAG_BACKUP_SEMANTICS under the hood).
filetime = "0.2"

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# Required by tauri::generate_context! (build-time macro reference), even
# though the crate code never names it directly.
serde_json = "1"
# CSPRNG for the boot handshake token (backed by BCryptGenRandom on Windows).
getrandom = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
# 快捷方式自愈（shortcut.rs）用的 ShellLink COM 封装；crate 已随 tauri/wry
# 在依赖树中（见 Cargo.lock windows 0.61.x），仅按需开启 feature
windows = { version = "0.61", default-features = false, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    # IShellLinkW::GetPath 的 WIN32_FIND_DATAW 参数类型所在 feature：
    # 该方法被用于跳过已正确的 .lnk，避免无谓重写
    "Win32_Storage_FileSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Foundation",
    # Required by the JobObjects API signatures (SECURITY_ATTRIBUTES in
    # CreateJobObjectW), even though the crate code never names it directly.
    "Win32_Security",
] }

[profile.release]
codegen-units = 1 # Better optimizations
lto = true        # Link-time optimization
opt-level = "s"   # Optimize for binary size
strip = true      # Strip debug symbols; panics are recorded to {data dir}\crash.log (see lib.rs)
