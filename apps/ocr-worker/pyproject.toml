[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlens-ocr-worker"
version = "0.1.0"
description = "PaperLens OCR worker: pypdfium2 render + RapidOCR recognition"
requires-python = ">=3.12"
dependencies = [
    "pypdfium2==5.13.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.23.2",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "pyclipper==1.4.0",
    "shapely==2.1.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "colorama==0.4.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.22.1",
    "pyinstaller-hooks-contrib==2026.6",
]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff]
line-length = 120
target-version = "py312"